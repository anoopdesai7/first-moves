<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive learning path for AI control, agent safety, sabotage monitoring, power-seeking, harnesses, and formal methods." />
    <meta name="theme-color" content="#0b1522" />
    <title>TARA Field Guide — Researching Safer AI Agents</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#/home" aria-label="TARA Field Guide home">
          <span class="brand-mark" aria-hidden="true">T</span>
          <span><strong>TARA</strong><small>FIELD GUIDE</small></span>
        </a>
        <button class="menu-button" id="menuButton" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>
        <div class="topbar-actions">
          <button class="icon-button" id="searchButton" type="button" aria-label="Open search" title="Search (/) ">⌕</button>
          <button class="icon-button" id="themeButton" type="button" aria-label="Toggle color theme" title="Toggle theme">◐</button>
          <a class="source-link" href="https://github.com/anoopdesai7/first-moves/tree/main/public/tara" target="_blank" rel="noreferrer">View source ↗</a>
        </div>
      </header>

      <aside class="sidebar" id="sidebar" aria-label="Course navigation">
        <div class="progress-card">
          <div><span>Your fieldwork</span><strong id="progressLabel">0%</strong></div>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
          <small id="progressDetail">0 of 12 modules explored</small>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-note">
          <span class="status-dot"></span>
          <p><strong>Evidence first.</strong><br />Separate what a paper demonstrates from what it suggests.</p>
        </div>
      </aside>

      <main id="main" tabindex="-1"></main>
    </div>

    <dialog class="search-dialog" id="searchDialog" aria-labelledby="searchTitle">
      <form method="dialog" class="search-head">
        <label id="searchTitle" for="searchInput">Search the field guide</label>
        <button value="cancel" aria-label="Close search">×</button>
      </form>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Try “monitoring”, “invariant”, or a paper title…" />
      <div id="searchResults" class="search-results"></div>
      <p class="search-tip"><kbd>↑</kbd><kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</p>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
